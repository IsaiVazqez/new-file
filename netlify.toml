[build]
  publish = "."
  functions = "netlify/functions"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Redirects for clean URLs
[[redirects]]
  from = "/nosotros"
  to = "/nosotros.html"
  status = 200

[[redirects]]
  from = "/contacto"
  to = "/contacto.html"
  status = 200

[[redirects]]
  from = "/portafolio"
  to = "/portafolio.html"
  status = 200
