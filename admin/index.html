<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — NewFile Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1>NewFile Studio</h1>
      <p>Inicia sesión para acceder al panel de administración</p>
      <form id="login-form" data-testid="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" data-testid="login-email" />
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" data-testid="login-password" />
        </div>
        <div id="login-error" class="error-msg" style="display:none" data-testid="login-error"></div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:1rem" data-testid="login-submit">Entrar</button>
      </form>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script>
    if (Auth.getAccessToken()) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('login-error');
      errEl.style.display = 'none';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        Auth.setTokens(data.data.accessToken, data.data.refreshToken);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errEl.textContent = err.message || 'Error al iniciar sesión';
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
