<body class="bg-black text-white antialiased">
  <!-- Page Loader -->
  <div class="page-loader" id="page-loader">
    <div class="loader-logo">
      <div class="loader-ring"></div>

  </div>

  <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">

    <!-- Header -->
    <div id="header-placeholder"></div>

    <main class="flex-1">

      <!-- ============================================================
           HERO — Page hero
           ============================================================ -->
      <section class="relative h-[60vh] w-full overflow-hidden" data-testid="services-hero">

        <div class="absolute inset-0 bg-cover bg-center bg-no-repeat"
             style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDGpJVYoyXcBdA8KDHMUN1IpnKe451pEmMBRwbCxt2RFk1YSaA56yttGAE8AGSMUpTeBoLKRzX2WQOsmyhF_Ji6IVoJ-il3a5Z590Rc4ZFA1a9ylqH-dHE8IXcrEmQKJ4uwFrEZuZ6v8FH1U9pUdFOjy1AZkKgm2X7o1VpiyRKKy23mwIxZAFwmdtsTsrM0SKbmeCnmBD-dAxqyLptqF51yKCHzK234pM1ooJxvxqONa7cvZ4jt0zq04KXlKpKltJLA1yAcJRE9N2c'); background-color: #0a0a0a;">
        </div>
        <div class="hero-overlay"></div>

        <div class="relative z-10 h-full flex flex-col items-center justify-center text-center px-6">
          <div class="fade-in max-w-2xl">
            <p class="text-xs md:text-sm tracking-[0.3em] uppercase text-white/50 mb-4">Soluciones visuales</p>
            <h1 class="text-5xl md:text-6xl lg:text-7xl font-bold tracking-tighter leading-[0.9] mb-6">
              NUESTROS SERVICIOS
            </h1>
            <p class="text-base md:text-lg text-white/60 font-light leading-relaxed max-w-xl mx-auto">
              Ofrecemos soluciones integrales de visualización para llevar tu proyecto arquitectónico del plano a la realidad visual.
            </p>
          </div>
        </div>

      </section>

      <!-- ============================================================
           SERVICES GRID
           ============================================================ -->
      <section class="section-padding px-6 md:px-12 lg:px-24">
        <div id="dynamic-services" class="max-w-7xl mx-auto space-y-0">
          <p style="text-align:center;color:#555;padding:4rem 0">Cargando servicios...</p>
        </div>
      </section>

      <script>
      (function () {
        var container = document.getElementById('dynamic-services');

        fetch('/api/v1/services?active=true')
          .then(function (res) { return res.json(); })
          .then(function (data) {
            var services = Array.isArray(data) ? data : (data.data || data.services || []);
            if (!services.length) {
              container.innerHTML = '<p style="text-align:center;color:#555;padding:4rem 0">No hay servicios disponibles.</p>';
              return;
            }

            var html = '';
            services.forEach(function (svc, i) {
              var num = String(i + 1).padStart(2, '0');
              var isOdd = i % 2 !== 0;
              var title = svc.title || '';
              var description = svc.description || '';
              var imageUrl = svc.image_url || '';
              var linkUrl = svc.link_url || '';

              var imageDiv =
                '<div class="h-[350px] lg:h-[500px] relative overflow-hidden' + (isOdd ? ' lg:order-1 -order-1' : '') + '">' +
                  '<img src="' + imageUrl + '" alt="' + title + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" />' +
                '</div>';

              var textDiv =
                '<div class="flex flex-col justify-center px-8 md:px-16 py-12 lg:py-0 bg-surface">' +
                  '<span class="text-5xl font-bold text-white/10 mb-4">' + num + '</span>' +
                  '<h3 class="text-2xl md:text-3xl font-bold tracking-tight mb-4">' + title + '</h3>' +
                  '<p class="text-white/60 font-light leading-relaxed max-w-md">' + description + '</p>' +
                '</div>';

              var inner;
              if (isOdd) {
                inner = textDiv + imageDiv;
              } else {
                inner = imageDiv + textDiv;
              }

              var block = '<div class="grid grid-cols-1 lg:grid-cols-2">' + inner + '</div>';

              if (linkUrl) {
                block = '<a href="' + linkUrl + '" style="display:block;text-decoration:none;color:inherit">' + block + '</a>';
              }

              html += block;
            });

            container.innerHTML = html;
          })
          .catch(function () {
            container.innerHTML = '<p style="text-align:center;color:#f55;padding:4rem 0">Error al cargar los servicios.</p>';
          });
      })();
      </script>

      <!-- ============================================================
           CTA SECTION
           ============================================================ -->
